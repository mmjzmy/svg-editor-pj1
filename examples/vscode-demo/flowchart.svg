<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <g id="flowchart">
    <g id="n1">
      <rect id="start" x="40" y="40" width="160" height="60" fill="#f5a623"/>
      <text id="start-label" x="120" y="75">开始</text>
    </g>
    <g id="n2">
      <rect id="process" x="240" y="40" width="160" height="60" fill="#4a90d9"/>
