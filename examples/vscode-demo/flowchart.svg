    </g>
    <circle id="done" cx="520" cy="70" r="30" fill="#7ed321"/>
    <line id="arrow1" x1="200" y1="70" x2="240" y2="70" stroke="#333333"/>
    <line id="arrow2" x1="400" y1="70" x2="490" y2="70" stroke="#333333"/>
    <text x="40" y="160">没有 id 的说明文字</text>
  </g>
